# ==============================================================================
# TerraVision — CodeQL Security Analysis
# Runs SAST (Static Application Security Testing) via GitHub CodeQL on
# Python (backend) and JavaScript (frontend) code.
# ==============================================================================

name: 🔐 CodeQL Security Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Sunday at 03:00 UTC
    - cron: "0 3 * * 0"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: 🔐 CodeQL — ${{ matrix.language }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]

    steps:
      - name: ⬇️  Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality

      - name: 🟢 Set up Node.js (JavaScript analysis)
        if: matrix.language == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install JS dependencies (for CodeQL JS analysis)
        if: matrix.language == 'javascript'
        run: npm ci

      - name: 🔐 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
